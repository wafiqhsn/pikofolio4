<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home — Piko</title>
    <link rel="stylesheet" href="Fonts/arial-narrow.css" />
<style>
      *, *::before, *::after { font-family: Arial, sans-serif !important; }
      .home-viewport,
      .home-viewport * {
        box-sizing: border-box;
      }

      /* PAGE LAYOUT: background, centering, and outer spacing. */
      .home-viewport {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 16vh 24px 8vh;
        margin: 0;
        background: #fff;
        color: #111;
        font-family: Arial, sans-serif;
      }

      /* HERO GROUP: spacing between the intro text and the image scene. */
      .home-hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7.8vh;
        width: 100%;
        margin: auto 0;
        text-align: center;
      }

      /* HERO TEXT: font size, line spacing, and maximum text width. */
      .home-intro {
        text-wrap: balance;
        width: auto;
        max-width: min(100%, 720px);
        margin: 0;
        font-family: "Arial Narrow", Arial, sans-serif !important;
        font-size: 32px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0;
      }

      /* DESKTOP IMAGE SIZE: scales the whole scene with a maximum width. */
      .home-scene {
        position: relative;
        width: min(80vw, 960px);
        max-width: 100%;
        margin: 0 auto;
        isolation: isolate;
      }

      .home-scene { aspect-ratio: 1918 / 1046; }
      /* FLOOR SHADOW: position, size, and 30% opacity. */
      .home-shadow {
        position: absolute;
        left: 50%;
        top: 92%;
        width: 100%;
        max-width: none;
        height: auto;
        transform: translate(-50%, -50%);
        opacity: 0.3;
        z-index: 0;
        pointer-events: none;
        user-select: none;
      }

      /* All assets share one scale; mobile only changes their horizontal arrangement. */
      /* OBJECT BOXES: x/y = position, w/h = size; percentages use the scene size. */
      .home-object, .home-detail {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--w);
        height: var(--h);
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        pointer-events: none;
      }

      .home-object-image {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
      }

      /* Split portrait: one shared canvas keeps every pose aligned with the fixed base. */
      .home-person-base, .home-person-pose {
        position: absolute;
        left: 0;
        width: 100%;
        object-fit: fill;
      }
      .home-person-base { top: 44.556962%; height: 55.443038%; }
      .home-person-pose { top: 0; height: 44.556962%; opacity: 0; }
      .home-person-pose[data-pose="1"] { opacity: 1; }
      .home-scene[data-person-pose="2"] .home-person-pose,
      .home-scene[data-person-pose="3"] .home-person-pose { opacity: 0; }
      .home-scene[data-person-pose="2"] .home-person-pose[data-pose="2"],
      .home-scene[data-person-pose="3"] .home-person-pose[data-pose="3"] { opacity: 1; }

      /* Live clock: cover only the printed number panels, preserving the original casing. */
      .home-clock-display {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .home-clock-display text {
        fill: #dce3e5;
        font-family: "Arial Narrow", Arial, sans-serif !important;
        font-size: 50px;
        font-weight: 700;
        letter-spacing: 0;
        text-anchor: middle;
        dominant-baseline: central;
        font-variant-numeric: tabular-nums;
      }

      /* Match the phone receiver to Piko's pose, including the shared 500ms hold. */
      .home-telephone-image { position: absolute; inset: 0; }
      .home-telephone-image--hover { opacity: 0; }
      .home-scene[data-person-pose="2"] .home-telephone-image--default { opacity: 0; }
      .home-scene[data-person-pose="2"] .home-telephone-image--hover { opacity: 1; }

      .home-detail { z-index: 20; }
      .home-object:focus-visible, .home-detail:focus-visible {
        outline: 1px dashed #ffce32;
        outline-offset: 2px;
      }



      /* YELLOW LABELS: font, padding, color, and visibility. */
      .home-tooltip {
        position: absolute;
        left: var(--label-x);
        top: var(--label-y);
        z-index: 30;
        padding: 0.45em 0.65em;
        border-radius: 0.45em;
        background: #ECEEF2;
        color: #080808;
        font-size: 10px;
        width: max-content;
        font-weight: 400;
        line-height: 1.05;
        text-align: left;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transform: translate(-50%, calc(-100% + 5px));
        transition: opacity 140ms ease, transform 140ms ease, visibility 140ms;
      }

      /* LABEL POINTER: the small triangle below each yellow label. */
      .home-tooltip::after {
        content: "";
        position: absolute;
        top: calc(100% - 1px);
        left: 50%;
        width: 0;
        height: 0;
        border: 0.48em solid transparent;
        border-bottom: 0;
        border-top-color: #ECEEF2;
        transform: translateX(-50%);
      }

      .home-tooltip.is-visible {
        opacity: 1;
        visibility: visible;
        transform: translate(-50%, -100%);
      }

      /* LAST.FM: inherit the same bubble and typography as other object labels. */
      #home-tip-spotify {
        max-width: min(220px, calc(100vw - 32px));
        text-align: center;
        white-space: normal;
        margin-left: var(--music-shift, 0px);
      }
      #home-tip-spotify::after { left: calc(50% - var(--music-shift, 0px)); }
      #home-tip-spotify .home-track-title,
      #home-tip-spotify .home-track-artist,
      #home-tip-spotify .home-track-time {
        display: block;
        font-size: inherit;
        font-weight: inherit;
        line-height: inherit;
        color: inherit;
        overflow-wrap: anywhere;
      }
      #home-tip-spotify .home-track-artist,
      #home-tip-spotify .home-track-time { margin-top: 0.25em; font-size: 0.85em; }
      #home-tip-spotify .home-track-title {
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #home-tip-spotify .home-track-time { opacity: 0.5; }

      .home-scene { cursor: default; }
      .home-scene * { cursor: inherit; }

      /* PIKO BUBBLE: grows with the typed text; bottom-left corner stays square. */
      .home-tooltip--speech {
        border-bottom-left-radius: 0;
        line-height: 1.15;
        transform: translateY(calc(-100% + 5px));
      }
      .home-tooltip--speech.is-visible { transform: translateY(-100%); }
      .home-speech-text {
        display: block;
        white-space: pre;
      }

      .home-tooltip--speech::after {
        left: 0;
        border-width: 0.8em;
        border-left: 0;
        transform: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .home-tooltip { transition: none; }
      }

      /* DESKTOP LABEL SIZE: applies from 1200px wide. */
      @media (min-width: 1200px) {
        .home-tooltip { font-size: 13px; }
      }

      /* Tablet: keep the full composition large without unlimited growth. */
      @media (min-width: 768px) and (max-width: 1199px) {
        .home-scene { width: min(92vw, 760px); }
      }

      /* MOBILE LAYOUT: text width, scene size, and object positions below 768px. */
      @media (max-width: 767px) {
        .home-viewport {
          overflow-x: clip;
          padding: 22vw 0 22vw;
        }
        .home-hero { gap: 16vw; }
        .home-intro {
          width: auto;
          max-width: min(calc(100% - 48px), 360px);
          font-size: 24px;
          line-height: 1.5;
        }
        .home-scene {
          width: min(100%, 480px);
          aspect-ratio: 910 / 700;
        }
        .home-object, .home-detail {
          left: var(--mobile-x);
          top: var(--mobile-y);
          width: var(--mobile-w);
          height: var(--mobile-h);
        }
        .home-shadow { width: 145%; top: 93%; }
          /* MOBILE OBJECT POSITIONS: keep all assets at the same relative scale. */

        .home-object[data-object="desk"] { --mobile-x:-18.8%; --mobile-y:40.4%; --mobile-w:137.66197%; --mobile-h:52.96265%; }
        .home-object[data-object="lamp"] { --mobile-x:47.8%; --mobile-y:4.0%; --mobile-w:50.60008%; --mobile-h:38.93601%; }
        #home-tip-lamp { left:73.1%; top:calc(4.0% - 8px); }
        .home-object[data-object="projects"] { --mobile-x:9.9%; --mobile-y:3.2%; --mobile-w:29.11365%; --mobile-h:38.99647%; }
        #home-tip-projects { left:24.4%; top:calc(3.9% - 8px); }
        .home-object[data-object="reference"] { --mobile-x:-1.1%; --mobile-y:37.4%; --mobile-w:21.30040%; --mobile-h:5.68321%; }
        #home-tip-reference { left:9.6%; top:calc(37.4% - 8px); }

        #home-tip-plant { left:6.1%; top:calc(4.2% - 8px); }
        .home-object[data-object="apple"] { --mobile-x:11.0%; --mobile-y:30.4%; --mobile-w:5.20883%; --mobile-h:7.07378%; }

        #home-tip-spotify { left:79.7%; top:calc(18.3% - 8px); }
        .home-object[data-object="contact"] { --mobile-x:61.5%; --mobile-y:31.5%; --mobile-w:20.55628%; --mobile-h:11.48733%; }
        #home-tip-contact { left:71.8%; top:calc(31.5% - 8px); }

        .home-object[data-object="coffee"] { --mobile-x:51.9%; --mobile-y:35.7%; --mobile-w:9.02244%; --mobile-h:7.37608%; }

        .home-detail[data-detail="watch"] { --mobile-x:47.7%; --mobile-y:37.1%; --mobile-w:2.85714%; --mobile-h:4.28571%; }

        .home-detail[data-detail="shoes"] { --mobile-x:26.0%; --mobile-y:71.4%; --mobile-w:17.03297%; --mobile-h:24.00000%; }
        #home-tip-shoes { left:34.6%; top:calc(71.4% - 8px); }
        #home-tip-piko { left: 49%; top: 0; }
      }
      .home-entrance-pending .home-intro,
      .home-entrance-pending .home-scene { opacity: 0; }
      .home-intro, .home-intro * { font-family: "Arial Narrow", Arial, sans-serif !important; }
    </style>
  </head>

    <script>
      (() => {
        const scene = document.querySelector('.home-scene');
        if (!scene) return;
        const hero = scene.closest('.home-hero');
        const intro = hero.querySelector('.home-intro');
        const entranceAnimations = new Set();
        hero.classList.add('home-entrance-pending');
        let entranceStarted = false;
        // ENTRANCE ANIMATION: hero scale/fade and intro text movement.
        const animateEntrance = () => {
          if (entranceStarted || controller.signal.aborted) return;
          entranceStarted = true;
          hero.classList.remove('home-entrance-pending');
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          const play = (element, frames, timing) => {
            const animation = element.animate(frames, {
              easing: 'cubic-bezier(0, 0, 0, 1)', fill: 'both', ...timing,
            });
            entranceAnimations.add(animation);
            animation.finished.then(() => {
              animation.cancel();
              entranceAnimations.delete(animation);
            }).catch(() => {});
          };
          // HERO TIMING: duration and delay values are in milliseconds.
          play(scene, [
            { opacity: 0, transform: 'scale(0.94)' },
            { opacity: 1, transform: 'scale(1)' },
          ], { duration: 2000 });
          // TEXT TIMING: delay controls when the intro appears after the hero.
          play(intro, [
            { opacity: 0, transform: 'translateY(18px)' },
            { opacity: 1, transform: 'translateY(0)' },
          ], { duration: 2000 });
        };
        const controller = new AbortController();
        const options = { signal: controller.signal };
        const musicTip = scene.querySelector('#home-tip-spotify');
        const trackTitle = musicTip.querySelector('.home-track-title');
        const trackArtist = musicTip.querySelector('.home-track-artist');
        const trackTime = musicTip.querySelector('.home-track-time');
        const lastfmUser = "wafiqhsn";
        const lastfmKey = "57700d069f0f6393a652370bf2f79427";
        let latestTrack = null;
        let musicTimer;
        let musicBusy = false;
        const fitMusicTip = () => {
          musicTip.style.setProperty('--music-shift', '0px');
          const rect = musicTip.getBoundingClientRect();
          const shift = Math.max(16 - rect.left, Math.min(0, window.innerWidth - 16 - rect.right));
          musicTip.style.setProperty('--music-shift', `${shift}px`);
        };
        const relativeTrackTime = (track) => {
          if (track['@attr']?.nowplaying === 'true') return 'Now playing';
          const timestamp = Number(track.date?.uts);
          if (!Number.isFinite(timestamp) || timestamp <= 0) return 'Recently played';
          const seconds = Math.max(0, Math.floor(Date.now() / 1000 - timestamp));
          if (seconds < 60) return 'Just now';
          if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
          if (seconds < 86400) return `${Math.floor(seconds / 3600)} hr ago`;
          const days = Math.floor(seconds / 86400);
          return `${days} ${days === 1 ? 'day' : 'days'} ago`;
        };
        const renderTrack = () => {
          if (!latestTrack) return;
          trackTitle.textContent = latestTrack.name || 'Unknown track';
          trackArtist.textContent = latestTrack.artist?.['#text'] || latestTrack.artist?.name || 'Unknown artist';
          trackTime.textContent = relativeTrackTime(latestTrack);
          if (musicTip.classList.contains('is-visible')) fitMusicTip();
        };
        const loadTrack = async () => {
          if (controller.signal.aborted || musicBusy) return;
          clearTimeout(musicTimer);
          renderTrack();
          if (document.hidden) {
            musicTimer = setTimeout(loadTrack, 30000);
            return;
          }
          musicBusy = true;
          const request = new AbortController();
          const abortRequest = () => request.abort();
          controller.signal.addEventListener('abort', abortRequest, { once: true });
          const timeout = setTimeout(abortRequest, 10000);
          try {
            const params = new URLSearchParams({ method: 'user.getrecenttracks', user: lastfmUser, api_key: lastfmKey, format: 'json', limit: '1' });
            const response = await fetch(`https://ws.audioscrobbler.com/2.0/?${params}`, { signal: request.signal });
            if (!response.ok) throw new Error('Last.fm unavailable');
            const data = await response.json();
            if (data.error) throw new Error('Last.fm unavailable');
            const tracks = data.recenttracks?.track;
            const track = Array.isArray(tracks) ? tracks[0] : tracks;
            if (controller.signal.aborted) return;
            if (track?.name) {
              latestTrack = track;
              renderTrack();
            } else if (!latestTrack) {
              trackTitle.textContent = 'No recent tracks';
              trackArtist.textContent = 'Last.fm';
              trackTime.textContent = '';
            }
          } catch (error) {
            if (controller.signal.aborted) return;
            if (latestTrack) {
              // A failed refresh cannot confirm that an earlier track is still playing.
              latestTrack = { ...latestTrack, '@attr': {}, date: latestTrack.date };
              renderTrack();
            } else {
              trackTitle.textContent = 'Music unavailable';
              trackArtist.textContent = 'Last.fm';
              trackTime.textContent = 'Try again shortly';
            }
          } finally {
            clearTimeout(timeout);
            controller.signal.removeEventListener('abort', abortRequest);
            musicBusy = false;
            if (!controller.signal.aborted) musicTimer = setTimeout(loadTrack, 30000);
          }
        };
        window.addEventListener('resize', () => {
          if (musicTip.classList.contains('is-visible')) fitMusicTip();
        }, options);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) loadTrack();
        }, options);
        loadTrack();

        // Follow the visitor's device time in 24-hour format and refresh at each minute boundary.
        const clock = scene.querySelector('[data-object="clock"]');
        const clockHours = clock.querySelector('[data-clock-hours]');
        const clockMinutes = clock.querySelector('[data-clock-minutes]');
        const clockStatus = scene.querySelector('#home-tip-clock');
        const jakartaHour = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Jakarta', hour: '2-digit', hourCycle: 'h23' });
        const statusForHour = (hour) => {
          if (hour >= 23 || hour < 6) return 'Sleeping';
          if (hour >= 9 && hour < 17) return 'Working';
          return 'Probably available';
        };
        let clockTimer;
        const updateClock = () => {
          clearTimeout(clockTimer);
          if (controller.signal.aborted) return;
          const now = new Date();
          const hours = String(now.getHours()).padStart(2, '0');
          const minutes = String(now.getMinutes()).padStart(2, '0');
          clockHours.textContent = hours;
          clockMinutes.textContent = minutes;
          const status = statusForHour(Number(jakartaHour.format(now)));
          clockStatus.textContent = status;
          clock.setAttribute('aria-label', `Clock, ${hours}:${minutes}. ${status}`);
          clockTimer = setTimeout(updateClock, 60000 - (now.getSeconds() * 1000 + now.getMilliseconds()));
        };
        updateClock();
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) updateClock();
        }, options);

        let active = null;
        let pointerTarget = null;
        let interactionTarget = null;
        // POSE HOLD: show each changed pose for at least 500ms; keep only the latest request.
        const poseHoldMs = 500;
        let poseTimer;
        let poseChangedAt = -Infinity;
        let requestedPose = '1';
        const applyRequestedPose = () => {
          poseTimer = undefined;
          if (controller.signal.aborted || (scene.dataset.personPose || '1') === requestedPose) return;
          scene.dataset.personPose = requestedPose;
          poseChangedAt = performance.now();
        };
        const requestPose = (pose) => {
          requestedPose = pose;
          clearTimeout(poseTimer);
          poseTimer = undefined;
          if ((scene.dataset.personPose || '1') === pose) return;
          const remaining = poseHoldMs - (performance.now() - poseChangedAt);
          if (remaining <= 0) applyRequestedPose();
          else poseTimer = setTimeout(applyRequestedPose, remaining);
        };
        // LABEL CONTROL: show one object label; handle the Piko bubble separately.
        const show = (button) => {
          interactionTarget = button;
          if (button?.dataset.object === 'spotify') { renderTrack(); fitMusicTip(); }
          requestPose(button?.dataset.object === 'contact' ? '2'
            : ['person', 'coffee'].includes(button?.dataset.object) ? '3' : '1');
          if (button?.dataset.object === 'person') {
            if (automaticFinished) startSpeech();
            button = null;
          }
          if (active) document.getElementById(active.getAttribute('aria-describedby'))?.classList.remove('is-visible');
          active = button;
          if (active) document.getElementById(active.getAttribute('aria-describedby'))?.classList.add('is-visible');
        };
        const objects = [...scene.querySelectorAll('.home-object')].sort((a, b) => Number(a.style.zIndex) - Number(b.style.zIndex));
        const details = [...scene.querySelectorAll('.home-detail')];
        const masks = new Map();
        // Test the PNG alpha channel so empty pixels never trigger a label.
        const hitAt = (event) => {
          for (const object of [...objects].reverse()) {
            const mask = masks.get(object);
            if (!mask) continue;
            const rect = object.getBoundingClientRect();
            const x = Math.floor((event.clientX - rect.left) / rect.width * mask.width);
            const y = Math.floor((event.clientY - rect.top) / rect.height * mask.height);
            if (x < 0 || y < 0 || x >= mask.width || y >= mask.height || mask.data[(y * mask.width + x) * 4 + 3] < 40) continue;
            if (object.dataset.object === 'person') {
              return details.find((detail) => {
                const area = detail.getBoundingClientRect();
                return event.clientX >= area.left && event.clientX <= area.right && event.clientY >= area.top && event.clientY <= area.bottom;
              }) || object;
            }
            return object.matches('button') ? object : null;
          }
          return null;
        };
        // OBJECT LINKS: use the same alpha-aware targets for mouse clicks and touch taps.
        const objectLinks = {
          projects: { page: 'work.html' },
          spotify: { url: 'https://open.spotify.com/user/exo6k0vh52vbopuqnrtx3j3jp?si=dbcd2a7b11054e1c' },
          reference: { url: 'https://id.pinterest.com/wafikhsn/' },
          person: { page: 'about.html' },
          contact: { email: 'mailto:wafiqhasan10@gmail.com' },
        };
        const linkFor = (target) => objectLinks[target?.dataset.detail ? 'person' : target?.dataset.object];
        const activateObject = (target) => {
          const link = linkFor(target);
          if (!link) return false;
          if (link.page) {
            if (typeof window.navigateTo === 'function') window.navigateTo(link.page);
            else window.location.assign(link.page);
          } else if (link.email) window.location.assign(link.email);
          else window.open(link.url, '_blank', 'noopener,noreferrer');
          return true;
        };
        // Mobile touch: first tap previews; a second tap on the same object opens it.
        let mobileTapTarget = null;
        let touchStart = null;
        let suppressClickUntil = 0;
        const tapKey = (target) => target?.dataset.detail
          ? scene.querySelector('[data-object="person"]') : target;
        const previewOrOpen = (target) => {
          const key = tapKey(target);
          if (key && mobileTapTarget === key && linkFor(target)) {
            mobileTapTarget = null;
            activateObject(target);
            return;
          }
          const wasSelected = key && mobileTapTarget === key;
          mobileTapTarget = wasSelected ? null : key;
          show(wasSelected ? null : target);
        };
        // Handle actual touch events instead of relying on a browser's synthetic mouse click.
        scene.addEventListener('touchstart', (event) => {
          suppressClickUntil = performance.now() + 1000;
          touchStart = event.touches.length === 1
            ? { x: event.touches[0].clientX, y: event.touches[0].clientY, moved: false } : null;
        }, { ...options, passive: true });
        scene.addEventListener('touchmove', (event) => {
          if (!touchStart) return;
          if (event.touches.length !== 1 || Math.hypot(
            event.touches[0].clientX - touchStart.x,
            event.touches[0].clientY - touchStart.y
          ) > 12) touchStart.moved = true;
        }, { ...options, passive: true });
        scene.addEventListener('touchend', (event) => {
          const start = touchStart;
          touchStart = null;
          suppressClickUntil = performance.now() + 1000;
          if (!start || start.moved || event.touches.length || !event.changedTouches.length) return;
          const touch = event.changedTouches[0];
          if (Math.hypot(touch.clientX - start.x, touch.clientY - start.y) > 12) return;
          if (event.cancelable) event.preventDefault();
          previewOrOpen(hitAt(touch));
        }, { ...options, passive: false });
        scene.addEventListener('touchcancel', () => {
          touchStart = null;
          suppressClickUntil = performance.now() + 1000;
        }, { ...options, passive: true });
        // Capture and discard compatibility clicks before they can reach a button handler.
        scene.addEventListener('click', (event) => {
          if (performance.now() >= suppressClickUntil) return;
          event.preventDefault();
          event.stopImmediatePropagation();
        }, { ...options, capture: true });
        scene.addEventListener('click', (event) => {
          if (event.detail === 0) return;
          const target = hitAt(event);
          if (event.pointerType === 'touch') {
            event.preventDefault();
            previewOrOpen(target);
          } else {
            mobileTapTarget = null;
            if (activateObject(target)) event.preventDefault();
          }
        }, options);
        // INTERACTION: mouse hover, touch taps, and keyboard focus.
        scene.addEventListener('pointermove', (event) => {
          if (event.pointerType !== 'touch' && performance.now() >= suppressClickUntil) {
            const target = hitAt(event);
            if (target !== pointerTarget) {
              pointerTarget = target;
              scene.style.cursor = linkFor(target) ? 'pointer' : 'default';
              show(target);
            }
          }
        }, options);
        scene.addEventListener('pointerleave', (event) => {
          if (event.pointerType !== 'touch' && performance.now() >= suppressClickUntil) { pointerTarget = null; scene.style.cursor = 'default'; show(null); }
        }, options);
        scene.querySelectorAll('button').forEach((button) => {
          button.addEventListener('focus', () => show(button), options);
          button.addEventListener('blur', () => { if (interactionTarget === button) show(null); }, options);
          button.addEventListener('click', (event) => {
            if (event.detail === 0) {
              if (activateObject(button)) event.preventDefault();
              else show(interactionTarget === button ? null : button);
            }
          }, options);
        });
        document.addEventListener('pointerdown', (event) => {
          if (!scene.contains(event.target)) { mobileTapTarget = null; show(null); }
        }, options);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') { mobileTapTarget = null; show(null); }
        }, options);
        const content = document.getElementById('content');
        const photos = [...scene.querySelectorAll('.home-object-image')];
        const speech = scene.querySelector('#home-tip-piko');
        const typed = speech.querySelector('.home-speech-text');
        // PIKO MESSAGE: \n starts a new line in the bubble.
        const message = 'Hi I’m Piko, let’s\ncollaborate!';
        let delayTimer;
        let typingTimer;
        let speechBusy = false;
        let automaticFinished = false;
        // TYPEWRITER: finish typing, hold for 3 seconds, then hide without looping.
        const startSpeech = () => {
          if (controller.signal.aborted || speechBusy) return;
          speechBusy = true;
          typed.textContent = '';
          speech.classList.add('is-visible');
          const holdSpeech = () => {
            typingTimer = setTimeout(() => {
              if (controller.signal.aborted) return;
              speech.classList.remove('is-visible');
              speechBusy = false;
              automaticFinished = true;
            }, 3000);
          };
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            typed.textContent = message;
            holdSpeech();
            return;
          }
          let index = 0;
          const typeNext = () => {
            if (controller.signal.aborted) return;
            typed.textContent = message.slice(0, ++index);
            if (index < message.length) typingTimer = setTimeout(typeNext, 120);
            else holdSpeech();
          };
          typeNext();
        };
        const waitFor = (target, event) => new Promise((resolve) => {
          target.addEventListener(event, resolve, { once: true, signal: controller.signal });
        });
        // LOADING: wait for the page reveal and decoded images before starting.
        const pageReady = content
          ? waitFor(content, 'pagereveal')
          : document.readyState === 'complete' ? Promise.resolve() : waitFor(window, 'load');
        const imageReady = Promise.all(photos.map(async (photo) => {
          if (photo.decode) await photo.decode().catch(() => {});
          else if (!photo.complete) await Promise.race([waitFor(photo, 'load'), waitFor(photo, 'error')]);
          if (controller.signal.aborted || !photo.naturalWidth) return;
          if (['person', 'contact'].includes(photo.parentElement.dataset.object)) return;
          const canvas = document.createElement('canvas');
          canvas.width = photo.naturalWidth;
          canvas.height = photo.naturalHeight;
          const context = canvas.getContext('2d', { willReadFrequently: true });
          context.drawImage(photo, 0, 0);
          masks.set(photo.parentElement, context.getImageData(0, 0, canvas.width, canvas.height));
        })).then(() => {
          if (controller.signal.aborted) return;
          // Keep a stable phone hit area across both receiver states.
          const phone = scene.querySelector('[data-object="contact"]');
          const phoneCanvas = document.createElement('canvas');
          phoneCanvas.width = 442;
          phoneCanvas.height = 190;
          const phoneContext = phoneCanvas.getContext('2d', { willReadFrequently: true });
          for (const photo of phone.querySelectorAll('.home-object-image')) {
            if (photo.naturalWidth) phoneContext.drawImage(photo, 0, 0, 442, 190);
          }
          masks.set(phone, phoneContext.getImageData(0, 0, 442, 190));
          const person = scene.querySelector('[data-object="person"]');
          const canvas = document.createElement('canvas');
          canvas.width = 1121;
          canvas.height = 1580;
          const context = canvas.getContext('2d', { willReadFrequently: true });
          const base = person.querySelector('.home-person-base');
          if (base.naturalWidth) context.drawImage(base, 0, 704, 1121, 876);
          // A stable union of the resting and waving silhouettes prevents hover flicker.
          for (const pose of person.querySelectorAll('[data-pose="1"], [data-pose="3"]')) {
            if (pose.naturalWidth) context.drawImage(pose, 0, 0, 1121, 704);
          }
          masks.set(person, context.getImageData(0, 0, canvas.width, canvas.height));
        });
        // AUTO GREETING: show once, 2 seconds after the page and images are ready.
        Promise.all([pageReady, imageReady]).then(() => {
          if (controller.signal.aborted) return;
          animateEntrance();
          if (photos.some((photo) => !photo.naturalWidth)) return;
          delayTimer = setTimeout(startSpeech, 1000);
        });
        // CLEANUP: stop timers and animations when leaving Home.
        content?.addEventListener('pageleave', () => {
          entranceAnimations.forEach((animation) => animation.cancel());
          clearTimeout(delayTimer);
          clearTimeout(typingTimer);
          clearTimeout(poseTimer);
          clearTimeout(clockTimer);
          clearTimeout(musicTimer);
          controller.abort();
        }, { once: true });
      })();
    </script>
  </body>
</html>
