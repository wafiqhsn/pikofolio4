      /* Legacy base styles; page utilities override some rules. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* NAVIGATION: spacing, position, font size, and active tab color. */
      #navbar {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
      }
      #navbar nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: transparent;
      }
      #navbar .nav-link {
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 24px;
        font-weight: 400;
        font-style: normal;
        line-height: 1.15;
        text-decoration: none;
        color: #ccc;
        transition: none;
      }
      #navbar .nav-link[aria-current="page"] { color: #000; }
      #navbar .nav-link:hover { color: #000; }
      #navbar .nav-link:focus-visible {
        outline: 1px solid currentColor;
        outline-offset: 5px;
      }
      @media (max-width: 767px) {
        #navbar { top: 16px; }
        #navbar nav { gap: 16px; }
        #navbar .nav-link { font-size: 22px; }
      }

      .page {
        max-width: 1000px;
        margin: auto;
        padding: 60px;
      }

      .fade-out {
        opacity: 0;
        transition: 0.15s;
      }
      /* HEADER CORNERS: home logo and three-dot download menu. */
      .header-logo, .header-more {
        position: fixed;
        top: 10px;
        z-index: 10000;
      }
      .header-logo {
        left: 20px;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .header-logo img { display: block; width: 32px; height: auto; }
      .header-more { right: 20px; }
      .header-more-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #000;
        cursor: pointer;
      }
      /* DOWNLOAD MENU: dropdown box and link styles. */
      .header-downloads {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 190px;
        padding: 6px;
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 6px 20px rgb(0 0 0 / 8%);
      }
      .header-downloads[hidden] { display: none; }
      .header-downloads a {
        display: block;
        padding: 11px 12px;
        border-radius: 5px;
        color: #111;
        font: 14px/1.3 Helvetica, Arial, sans-serif;
        text-decoration: none;
        white-space: nowrap;
      }
      .header-downloads a:hover { background: #f1f1f1; }
      .header-logo:focus-visible, .header-more-button:focus-visible,
      .header-downloads a:focus-visible { outline: 2px solid #777; outline-offset: 2px; }
      @media (max-width: 767px) {
        .header-logo, .header-more { top: 5px; }
        .header-logo { left: 8px; }
        .header-more { right: 8px; }
        .header-logo img { width: 28px; }
      }

        position: fixed;
        bottom: 18px;
        left: 0;
        width: 100%;
        margin: 0;
        z-index: 9000;
        color: #8a8a8a;
        font: 14px/1.4 Helvetica, Arial, sans-serif;
        text-align: center;
        pointer-events: none;
        animation: none;
        transition: none;

      body.site-loading { overflow: hidden; }
      body.site-loading > #navbar,
      body.site-loading > .header-logo,
      body.site-loading > .header-more,
      body.site-loading > .site-copyright { visibility: hidden; }

        position: fixed;
        inset: 0;
        z-index: 20000;
        display: flex;
        flex-direction: column;
        gap: 24px;

    <script>
      const content = document.getElementById("content");

      const navLinks = document.querySelectorAll(".nav-link");

      // HELLO DRAWING: plays once per site opening; normal tab changes skip it.
      const helloLoader = document.getElementById('helloLoader');
      const helloPath = document.getElementById('helloPath');
      let firstPagePending = true;
      content.inert = true;
      const helloFinished = (() => {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          helloPath.style.strokeDashoffset = '0';
          return Promise.resolve();
        }
        const drawing = helloPath.animate([
          { strokeDashoffset: '1' }, { strokeDashoffset: '0' },
        ], { duration: 1500, easing: 'ease-in-out', fill: 'forwards' });
        return drawing.finished.then(() => {
          helloPath.style.strokeDashoffset = '0';
          drawing.cancel();
          // Hold the completed Hello for 500 ms before revealing Home.
          return new Promise((resolve) => setTimeout(resolve, 100));
        });
      })();

      // FIRST LOAD: no short image timeout; keep Hello until images are decoded.
      async function finishFirstLoad() {
        const imageReady = Array.from(document.images).map(async (img) => {
          if (!img.getAttribute('src')) return;
          if (!img.complete) await new Promise((resolve) => {
            const finish = () => {
              img.removeEventListener('load', finish);
              img.removeEventListener('error', finish);
              resolve();
            };
            img.addEventListener('load', finish, { once: true });
            img.addEventListener('error', finish, { once: true });
            if (img.complete) finish();
          });
          if (img.decode && img.naturalWidth) await img.decode().catch(() => {});
        });
        await Promise.all([helloFinished, ...imageReady, document.fonts.ready]);
        // HELLO EXIT: softly fade the lettering before revealing Home.
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          await helloLoader.querySelector('svg').animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: 600, easing: 'ease-in-out', fill: 'forwards' }
          ).finished;
        }
        firstPagePending = false;
        content.inert = false;
        document.body.classList.remove('site-loading');
        helloLoader.remove();
      }
      document.getElementById('helloRetry').addEventListener('click', () => {
        document.getElementById('helloError').hidden = true;
        loadPage('home.html');
      });

      // Run scripts from the loaded page.
      function runScripts(container) {
        container.querySelectorAll("script").forEach((oldScript) => {
          const newScript = document.createElement("script");
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
          document.body.removeChild(newScript);
        });
      }

      // PAGE ORDER: controls the order used by scrolling and swiping.
      const tabOrder = ["home.html", "work.html", "about.html"];
      const desktopScroll = window.matchMedia(
        "(min-width: 1024px) and (hover: hover) and (pointer: fine)",
      );
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let currentPage = null;
      let changingPage = false;
      let queuedPage = null;
      let destinationPage = null;
      let wheelTotal = 0;
      let lastWheelTime = 0;
      let wheelBlockedUntil = 0;

      // Avoid hiding a page indefinitely for slow or lazy-loaded images.
      function waitForImages(container) {
        return Promise.all(
          Array.from(container.querySelectorAll("img"))
            .filter((img) => !img.complete && img.loading !== "lazy" && img.getAttribute("src"))
            .map(
              (img) =>
                new Promise((resolve) => {
                  const finish = () => {
                    clearTimeout(timeout);
                    img.removeEventListener("load", finish);
                    img.removeEventListener("error", finish);
                    resolve();
                  };
                  const timeout = setTimeout(finish, 1500);
                  img.addEventListener("load", finish, { once: true });
                  img.addEventListener("error", finish, { once: true });
                  if (img.complete) finish();
                }),
            ),
        );
      }

      // Let dynamically generated styles and layout settle before revealing a page.
      function settlePageLayout() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      // Move content up when advancing and down when returning.
      async function animatePage(entering, direction) {
        if (reducedMotion.matches || (entering && currentPage === "home.html")) return;
        const distance = desktopScroll.matches ? 72 : 28;
        const hidden = {
          opacity: 0,
          transform: `translateY(${(entering ? direction : -direction) * distance}px)`,
        };
        const visible = { opacity: 1, transform: "translateY(0)" };
        const animation = content.animate(entering ? [hidden, visible] : [visible, hidden], {
          duration: entering ? 480 : 220,
          easing: "cubic-bezier(0.22, 1, 0.36, 1)",
          fill: "both",
        });
        try {
          await animation.finished;
        } finally {
          if (!entering) content.style.opacity = "0";
          animation.cancel();
        }
      }

      // ACTIVE TAB: update immediately, even while the next page is loading.
      function updateActiveTab(page) {
        navLinks.forEach((link) => {
          if (link.dataset.page === page) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        });
      }

      // Serialize navigation and keep the latest click while a page is loading.
      async function loadPage(page) {
        if (!tabOrder.includes(page)) return;
        updateActiveTab(page);
        if (changingPage) {
          queuedPage = page;
          return;
        }
        if (page === currentPage) return;
        changingPage = true;
        destinationPage = page;
        // Count the 800ms wheel delay from the start, not the end.
        wheelBlockedUntil = performance.now() + 800;
        content.setAttribute("aria-busy", "true");
        content.style.pointerEvents = "none";
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        const direction =
          currentPage && tabOrder.indexOf(page) < tabOrder.indexOf(currentPage) ? -1 : 1;
        try {
          // Keep the existing page visible if fetching fails.
          const response = await fetch(page, { signal: controller.signal });
          if (!response.ok) throw new Error(`Unable to load ${page}: ${response.status}`);
          const html = await response.text();
          clearTimeout(timeout);
          if (currentPage) await animatePage(false, direction);
          content.style.opacity = "0";
          content.dispatchEvent(new Event("pageleave"));
          content.innerHTML = html;
          window.scrollTo({ top: 0, left: 0, behavior: "instant" });
          runScripts(content);
          currentPage = page;
          await settlePageLayout();
          if (firstPagePending) await finishFirstLoad();
          else await waitForImages(content);
          await settlePageLayout();
          content.style.opacity = "1";
          content.dispatchEvent(new Event("pagereveal"));
          await animatePage(true, direction);
        } catch (error) {
          console.error("Page navigation failed:", error);
          if (firstPagePending) {
            currentPage = null;
            document.getElementById('helloError').hidden = false;
          }
        } finally {
          clearTimeout(timeout);
          content.style.opacity = "1";
          content.removeAttribute("aria-busy");
          content.style.removeProperty("pointer-events");
          changingPage = false;
          wheelTotal = 0;
          destinationPage = null;
          const nextPage = queuedPage;
          queuedPage = null;
          if (nextPage && nextPage !== currentPage) loadPage(nextPage);
          // Restore the visible page if loading fails; never overwrite a queued click.
          else updateActiveTab(currentPage || "home.html");
        }
      }

      // NAVIGATION CLICKS: open the selected page without reloading the website.
      navLinks.forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          loadPage(link.dataset.page);
        });
      });
      // Start fetching Home while the Hello path is being drawn.
      queueMicrotask(() => loadPage("home.html"));
      window.navigateTo = loadPage;

      // DOWNLOAD MENU CONTROLS: toggle, outside click, Escape, and logo click.
      const headerMore = document.getElementById('headerMore');
      const moreButton = document.getElementById('headerMoreButton');
      const downloads = document.getElementById('headerDownloads');
      const setDownloadsOpen = (open) => {
        downloads.hidden = !open;
        moreButton.setAttribute('aria-expanded', String(open));
      };
      moreButton.addEventListener('click', () => setDownloadsOpen(downloads.hidden));
      document.getElementById('homeLogo').addEventListener('click', (event) => {
        event.preventDefault();
        setDownloadsOpen(false);
        loadPage('home.html');
      });
      document.addEventListener('pointerdown', (event) => {
        if (!headerMore.contains(event.target)) setDownloadsOpen(false);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !downloads.hidden) {
          setDownloadsOpen(false);
          moreButton.focus();
        }
      });
      headerMore.addEventListener('focusout', (event) => {
        if (!headerMore.contains(event.relatedTarget)) setDownloadsOpen(false);
      });
      downloads.addEventListener('click', (event) => {
        if (event.target.closest('a')) {
          setDownloadsOpen(false);
          moreButton.focus();
        }
      });

      // Preserve scrolling inside nested panels and form controls.
      function canScrollInside(target, direction) {
        if (!(target instanceof Element)) return false;
        if (target.closest("input, textarea, select, [contenteditable]")) return true;
        for (let node = target; node && node !== document.body; node = node.parentElement) {
          if (!/(auto|scroll)/.test(getComputedStyle(node).overflowY)) continue;
          if (direction > 0 && node.scrollTop + node.clientHeight < node.scrollHeight - 2)
            return true;
          if (direction < 0 && node.scrollTop > 2) return true;
        }
        return false;
      }

      // Continuous desktop wheel navigation, with an 800ms cooldown at page edges.
      document.addEventListener(
        "wheel",
        (event) => {
          if (
            !desktopScroll.matches ||
            event.ctrlKey ||
            event.metaKey ||
            !event.deltaY ||
            Math.abs(event.deltaX) > Math.abs(event.deltaY)
          )
            return;
          const direction = Math.sign(event.deltaY);
          if (canScrollInside(event.target, direction)) return;
          const now = performance.now();
          const newGesture = now - lastWheelTime > 220;
          lastWheelTime = now;
          if (newGesture) {
            wheelTotal = 0;
          }
          const scroller = document.scrollingElement;
          const atEdge =
            direction > 0
              ? scroller.scrollTop + window.innerHeight >= scroller.scrollHeight - 3
              : scroller.scrollTop <= 3;
          if (!atEdge && !changingPage) {
            wheelTotal = 0;
            return;
          }
          const nextIndex = tabOrder.indexOf(destinationPage || currentPage) + direction;
          if (!currentPage || nextIndex < 0 || nextIndex >= tabOrder.length) return;
          event.preventDefault();
          if (now < wheelBlockedUntil) return;
          const delta =
            event.deltaY *
            (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerHeight : 1);
          if (Math.sign(wheelTotal) !== direction) wheelTotal = 0;
          wheelTotal += delta;
          if (Math.abs(wheelTotal) < 60) return;
          wheelTotal = 0;
          wheelBlockedUntil = now + 800;
          loadPage(tabOrder[nextIndex]);
        },
        { passive: false },
      );

      // Vertical touch navigation: swipe up for next, down for previous.
      // Start at a page edge so long pages keep their normal reading scroll.
      let touchGesture = null;
      document.addEventListener("touchstart", (event) => {
        touchGesture = null;
        if (event.touches.length !== 1 || !currentPage) return;
        const touch = event.touches[0];
        const scroller = document.scrollingElement;
        touchGesture = {
          x: touch.clientX,
          y: touch.clientY,
          target: event.target,
          atTop: scroller.scrollTop <= 3,
          atBottom: scroller.scrollTop + window.innerHeight >= scroller.scrollHeight - 3,
          direction: 0,
          distance: 0,
        };
      }, { passive: true });

      document.addEventListener("touchmove", (event) => {
        if (!touchGesture) return;
        if (event.touches.length !== 1) { touchGesture = null; return; }
        const dx = event.touches[0].clientX - touchGesture.x;
        const dy = touchGesture.y - event.touches[0].clientY;
        touchGesture.direction = 0;
        touchGesture.distance = 0;
        if (Math.abs(dy) <= Math.abs(dx) || Math.abs(dy) < 10) return;
        const direction = Math.sign(dy);
        if (canScrollInside(touchGesture.target, direction)) return;
        if (direction > 0 ? !touchGesture.atBottom : !touchGesture.atTop) return;
        const index = tabOrder.indexOf(destinationPage || currentPage) + direction;
        if (index < 0 || index >= tabOrder.length) return;
        // Prevent overscroll only when this gesture can navigate to another page.
        if (event.cancelable) event.preventDefault();
        touchGesture.direction = direction;
        touchGesture.distance = Math.abs(dy);
      }, { passive: false });

      document.addEventListener("touchend", () => {
        const gesture = touchGesture;
        touchGesture = null;
        if (!gesture || !gesture.direction || gesture.distance < 60) return;
        const now = performance.now();
        if (now < wheelBlockedUntil) return;
        const index = tabOrder.indexOf(destinationPage || currentPage) + gesture.direction;
        if (index < 0 || index >= tabOrder.length) return;
        wheelBlockedUntil = now + 800;
        loadPage(tabOrder[index]);
      }, { passive: true });

      // Leave pinch zoom and cancelled gestures to the browser.
      document.addEventListener("touchcancel", () => { touchGesture = null; }, { passive: true });
    </script>
  </body>
</html>
