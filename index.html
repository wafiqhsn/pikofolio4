<style>
      *, *::before, *::after { font-family: Arial, sans-serif !important; }
      body {
        font-family: Arial, sans-serif;
      }

      /* Legacy base styles; page utilities override some rules. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Keep vertical reading and pinch zoom native; handle horizontal page swipes in JavaScript. */
      #content { touch-action: pan-y pinch-zoom; }

      /* NAVIGATION: compact capsule with one sliding white active pill. */
      #navbar {
        position: fixed;
        top: 17px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
      }
      #navbar nav {
        --nav-padding: 3px;
        --active-tab: 0;
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        width: 230px;
        height: 30px;
        padding: var(--nav-padding);
        border: 1.5px solid #e2e4e5;
        border-radius: 999px;
        background: #d9dcde;
      }
      #navbar nav::before {
        content: "";
        position: absolute;
        top: var(--nav-padding);
        bottom: var(--nav-padding);
        left: var(--nav-padding);
        width: calc((100% - 2 * var(--nav-padding)) / 4);
        border-radius: 999px;
        background: #fff;
        transform: translateX(calc(var(--active-tab) * 100%));
        transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
        z-index: 0;
      }
      #navbar .nav-link {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        border-radius: 999px;
        font-family: Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        font-style: normal;
        line-height: 1;
        text-decoration: none;
        color: #000;
        background: transparent;
        -webkit-tap-highlight-color: transparent;
      }
      #navbar .nav-link:focus-visible {
        outline: 1px solid #333;
        outline-offset: 1px;
      }
      @media (max-width: 767px) {
        #navbar { top: 16px; }
        #navbar nav {
          --nav-padding: 2px;
          width: 182px;
          height: 24px;
          border-width: 1px;
        }
        #navbar .nav-link { font-size: 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #navbar nav::before { transition: none; }
      }

      .page {
        max-width: 1000px;
        margin: auto;
        padding: 60px;
      }

      .fade-out {
        opacity: 0;
        transition: 0.15s;
      }
      /* HEADER CORNERS: home logo and three-dot download menu. */
      .header-logo, .header-more {
        position: fixed;
        top: 10px;
        z-index: 10000;
      }
      .header-logo {
        left: 20px;
        width: 96px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .header-logo img { display: block; width: 96px; height: auto; opacity: 0.2; transition: opacity 220ms ease; }
      .header-logo:hover img, .header-logo:focus-visible img { opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        .header-logo img { transition: none; }
      }
      .header-more { right: 20px; }
      .header-more-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #000;
        cursor: pointer;
      }
      /* DOWNLOAD MENU: dropdown box and link styles. */
      .header-downloads {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        min-width: 190px;
        padding: 6px;
        border: 1px solid #e5e5e5;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 6px 20px rgb(0 0 0 / 8%);
      }
      .header-downloads[hidden] { display: none; }
      .header-downloads a {
        display: block;
        padding: 11px 12px;
        border-radius: 5px;
        color: #111;
        font: 14px/1.3 Arial, sans-serif;
        text-decoration: none;
        white-space: nowrap;
      }
      .header-downloads a:hover { background: #f1f1f1; }
      .header-logo:focus-visible, .header-more-button:focus-visible,
      .header-downloads a:focus-visible { outline: 2px solid #777; outline-offset: 2px; }
      @media (max-width: 767px) {
        .header-logo, .header-more { top: 5px; }
        .header-logo { display: none; }
        .header-more { right: 8px; }
        .header-logo img { width: 100%; }
      }
      /* COPYRIGHT: visible on Home and About, outside page animations. */
      .site-copyright {
        position: fixed;
        bottom: 18px;
        left: 0;
        width: 100%;
        margin: 0;
        z-index: 9000;
        color: #8a8a8a;
        font: 14px/1.4 Arial, sans-serif;
        text-align: center;
        pointer-events: none;
        animation: none;
        transition: none;
      }
      .site-copyright[hidden] { display: none; }
      .footer-logo { display: none; }
      @media (max-width: 767px) {
        .site-copyright {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          bottom: calc(16px + env(safe-area-inset-bottom, 0px));
          font-size: 12px;
        }
        .footer-logo { display: flex; align-items: center; flex: 0 0 auto; pointer-events: auto; }
        .footer-logo img { display: block; width: 48px; height: auto; opacity: 0.2; transition: opacity 220ms ease; }
        .footer-logo:hover img, .footer-logo:focus-visible img { opacity: 1; }
        .footer-logo:focus-visible { outline: 1px solid #777; outline-offset: 4px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .footer-logo img { transition: none; }
      }
      /* PIKO LOADER: loop only while the first page is loading. */
      body.site-loading { overflow: hidden; }
      body.site-loading > #navbar,
      body.site-loading > .header-logo,
      body.site-loading > .header-more,
      body.site-loading > .site-copyright { visibility: hidden; }
      .hello-loader {
        position: fixed;
        inset: 0;
        z-index: 20000;
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      /* LOADER SIZE: adjust desktop and mobile widths separately. */
      .hello-loader-image {
        width: 120px;
        max-width: 80vw;
        height: auto;
        display: block;
      }
      @media (max-width: 767px) {
        .hello-loader-image { width: 66.6667px; }
      }
      .hello-error { text-align: center; font: 14px/1.5 Arial, sans-serif; }
      .hello-error[hidden] { display: none; }
      .hello-error button { margin-top: 10px; padding: 8px 16px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
    </style>

  <body class="bg-white text-black site-loading">

        <svg width="20" height="6.4" viewBox="0 0 25 8" fill="currentColor" aria-hidden="true">

      <div class="header-downloads" id="headerDownloads" hidden>
        <a href="https://drive.google.com/file/d/1ptUa8NC2_C57vPdolugWmaEgKEF1b3-g/view?usp=drive_link" target="_blank" rel="noopener noreferrer">Download Resume</a>

    <!-- NAVIGATION LINKS: Home, Work, Labs, and About. -->
    <div id="navbar">
      <nav aria-label="Main navigation">
        <a href="#" data-page="home.html" class="nav-link" aria-current="page">Home</a>
        <a href="#" data-page="work.html" class="nav-link">Work</a>

    <!-- Active page content -->

    <main id="content" class="min-h-screen"></main>
    <footer class="site-copyright">
      <a class="footer-logo" id="mobileHomeLogo" href="#" aria-label="Go to Home"><img src="Images/Logo.svg" alt="" width="150" height="30" /></a>
      <span>©2026 Wafiq Hasan</span>

    <script>
      const content = document.getElementById("content");

      const navLinks = document.querySelectorAll(".nav-link");

      // PIKO LOOP: show for at least one second; keep looping while Home loads.
      const helloLoader = document.getElementById('helloLoader');
      const loadingArtwork = document.getElementById('loadingArtwork');
      const loaderMinimumReady = new Promise((resolve) => setTimeout(resolve, 1000));
      let firstPagePending = true;
      content.inert = true;

      // FIRST LOAD: reveal Home when ready and the one-second minimum has elapsed.
      async function finishFirstLoad() {
        const imageReady = Array.from(document.images).map(async (img) => {
          if (img === loadingArtwork || !img.getAttribute('src')) return;
          if (!img.complete) await new Promise((resolve) => {
            const finish = () => {
              img.removeEventListener('load', finish);
              img.removeEventListener('error', finish);
              resolve();
            };
            img.addEventListener('load', finish, { once: true });
            img.addEventListener('error', finish, { once: true });
            if (img.complete) finish();
          });
          if (img.decode && img.naturalWidth) await img.decode().catch(() => {});
        });
        await Promise.all([loaderMinimumReady, ...imageReady, document.fonts.ready]);
        firstPagePending = false;
        content.inert = false;
        document.body.classList.remove('site-loading');
        helloLoader.remove();
      }
      document.getElementById('helloRetry').addEventListener('click', () => {
        document.getElementById('helloError').hidden = true;
        loadPage('home.html');
      });

      // Run scripts from the loaded page.
      function runScripts(container) {
        container.querySelectorAll("script").forEach((oldScript) => {
          const newScript = document.createElement("script");
          newScript.textContent = oldScript.textContent;
          document.body.appendChild(newScript);
          document.body.removeChild(newScript);
        });
      }

      // PAGE ORDER: controls the order used by scrolling and swiping.
      const tabOrder = ["home.html", "work.html", "labs.html", "about.html"];
      const desktopScroll = window.matchMedia(
        "(min-width: 1024px) and (hover: hover) and (pointer: fine)",
      );
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let currentPage = null;
      let changingPage = false;
      let queuedPage = null;
      let destinationPage = null;
      let wheelTotal = 0;
      let lastWheelTime = 0;
      let wheelBlockedUntil = 0;

      // Avoid hiding a page indefinitely for slow or lazy-loaded images.
      function waitForImages(container) {
        return Promise.all(
          Array.from(container.querySelectorAll("img"))
            .filter((img) => !img.complete && img.loading !== "lazy" && img.getAttribute("src"))
            .map(
              (img) =>
                new Promise((resolve) => {
                  const finish = () => {
                    clearTimeout(timeout);
                    img.removeEventListener("load", finish);
                    img.removeEventListener("error", finish);
                    resolve();
                  };
                  const timeout = setTimeout(finish, 1500);
                  img.addEventListener("load", finish, { once: true });
                  img.addEventListener("error", finish, { once: true });
                  if (img.complete) finish();
                }),
            ),
        );
      }

      // Let dynamically generated styles and layout settle before revealing a page.
      function settlePageLayout() {
        return new Promise((resolve) => {
          requestAnimationFrame(() => requestAnimationFrame(resolve));
        });
      }

      // Every page moves upward on entry and exit, regardless of navigation direction.
      async function animatePage(entering) {
        if (reducedMotion.matches) return;
        const distance = desktopScroll.matches ? 72 : 28;
        const hidden = {
          opacity: 0,
          transform: `translateY(${(entering ? 1 : -1) * distance}px)`,
        };
        const visible = { opacity: 1, transform: "translateY(0)" };
        const animation = content.animate(entering ? [hidden, visible] : [visible, hidden], {
          duration: entering ? 480 : 220,
          easing: "cubic-bezier(0.22, 1, 0.36, 1)",
          fill: "both",
        });
        try {
          await animation.finished;
        } finally {
          if (!entering) content.style.opacity = "0";
          animation.cancel();
        }
      }

      // ACTIVE TAB: update immediately, even while the next page is loading.
      function updateActiveTab(page) {
        document.querySelector(".site-copyright").hidden = !["home.html", "about.html"].includes(page);
        document.querySelector("#navbar nav").style.setProperty("--active-tab", Math.max(0, tabOrder.indexOf(page)));
        navLinks.forEach((link) => {
          if (link.dataset.page === page) link.setAttribute("aria-current", "page");
          else link.removeAttribute("aria-current");
        });
      }

      // Serialize navigation and keep the latest click while a page is loading.
      async function loadPage(page) {
        if (!tabOrder.includes(page)) return;
        updateActiveTab(page);
        if (changingPage) {
          queuedPage = page;
          return;
        }
        if (page === currentPage) return;
        changingPage = true;
        destinationPage = page;
        // Count the horizontal gesture cooldown from the start of navigation.
        wheelBlockedUntil = performance.now() + 800;
        content.setAttribute("aria-busy", "true");
        content.style.pointerEvents = "none";
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);
        try {
          // Keep the existing page visible if fetching fails.
          const response = await fetch(page, { signal: controller.signal, cache: "no-cache" });
          if (!response.ok) throw new Error(`Unable to load ${page}: ${response.status}`);
          const html = await response.text();
          clearTimeout(timeout);
          if (currentPage) await animatePage(false);
          content.style.opacity = "0";
          content.dispatchEvent(new Event("pageleave"));
          content.innerHTML = html;
          window.scrollTo({ top: 0, left: 0, behavior: "instant" });
          runScripts(content);
          currentPage = page;
          await settlePageLayout();
          if (firstPagePending) await finishFirstLoad();
          else await waitForImages(content);
          await settlePageLayout();
          content.style.opacity = "1";
          content.dispatchEvent(new Event("pagereveal"));
          await animatePage(true);
        } catch (error) {
          console.error("Page navigation failed:", error);
          if (firstPagePending) {
            currentPage = null;
            document.getElementById('helloError').hidden = false;
          }
        } finally {
          clearTimeout(timeout);
          content.style.opacity = "1";
          content.removeAttribute("aria-busy");
          content.style.removeProperty("pointer-events");
          changingPage = false;
          wheelTotal = 0;
          destinationPage = null;
          const nextPage = queuedPage;
          queuedPage = null;
          if (nextPage && nextPage !== currentPage) loadPage(nextPage);
          // Restore the visible page if loading fails; never overwrite a queued click.
          else updateActiveTab(currentPage || "home.html");
        }
      }

      // NAVIGATION CLICKS: open the selected page without reloading the website.
      navLinks.forEach((link) => {
        link.addEventListener("click", (event) => {
          event.preventDefault();
          loadPage(link.dataset.page);
        });
      });
      // Start fetching Home while the Hello path is being drawn.
      queueMicrotask(() => loadPage("home.html"));
      window.navigateTo = loadPage;

      // DOWNLOAD MENU CONTROLS: toggle, outside click, Escape, and logo click.
      const headerMore = document.getElementById('headerMore');
      const moreButton = document.getElementById('headerMoreButton');
      const downloads = document.getElementById('headerDownloads');
      const setDownloadsOpen = (open) => {
        downloads.hidden = !open;
        moreButton.setAttribute('aria-expanded', String(open));
      };
      moreButton.addEventListener('click', () => setDownloadsOpen(downloads.hidden));
      document.querySelectorAll('#homeLogo, #mobileHomeLogo').forEach((logo) => {
        logo.addEventListener('click', (event) => {
          event.preventDefault();
          setDownloadsOpen(false);
          loadPage('home.html');
        });
      });
      document.addEventListener('pointerdown', (event) => {
        if (!headerMore.contains(event.target)) setDownloadsOpen(false);
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !downloads.hidden) {
          setDownloadsOpen(false);
          moreButton.focus();
        }
      });
      headerMore.addEventListener('focusout', (event) => {
        if (!headerMore.contains(event.relatedTarget)) setDownloadsOpen(false);
      });
      downloads.addEventListener('click', (event) => {
        if (event.target.closest('a')) {
          setDownloadsOpen(false);
          moreButton.focus();
        }
      });

      // Preserve horizontal scrolling inside nested panels and leave form controls alone.
      function canScrollInside(target, direction) {
        if (!(target instanceof Element)) return false;
        if (target.closest("input, textarea, select, [contenteditable]")) return true;
        for (let node = target; node && node !== document.body; node = node.parentElement) {
          if (!/(auto|scroll)/.test(getComputedStyle(node).overflowX)) continue;
          if (direction > 0 && node.scrollLeft + node.clientWidth < node.scrollWidth - 2)
            return true;
          if (direction < 0 && node.scrollLeft > 2) return true;
        }
        return false;
      }

      // Horizontal trackpad navigation; vertical wheel scrolling stays within the page.
      document.addEventListener("wheel", (event) => {
        const horizontal = event.deltaX || (event.shiftKey ? event.deltaY : 0);
        if (!desktopScroll.matches || event.ctrlKey || event.metaKey || !horizontal) return;
        if (!event.shiftKey && Math.abs(horizontal) <= Math.abs(event.deltaY)) return;
        const direction = Math.sign(horizontal);
        if (canScrollInside(event.target, direction)) return;
        const now = performance.now();
        if (now - lastWheelTime > 220) wheelTotal = 0;
        lastWheelTime = now;
        const nextIndex = tabOrder.indexOf(destinationPage || currentPage) + direction;
        if (!currentPage || nextIndex < 0 || nextIndex >= tabOrder.length) return;
        event.preventDefault();
        if (now < wheelBlockedUntil) return;
        const delta = horizontal * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? window.innerWidth : 1);
        if (Math.sign(wheelTotal) !== direction) wheelTotal = 0;
        wheelTotal += delta;
        if (Math.abs(wheelTotal) < 60) return;
        wheelTotal = 0;
        wheelBlockedUntil = now + 800;
        loadPage(tabOrder[nextIndex]);
      }, { passive: false });

      // Touch navigation: swipe left for the next page, right for the previous page.
      let touchGesture = null;
      document.addEventListener("touchstart", (event) => {
        touchGesture = null;
        if (event.touches.length !== 1 || !currentPage) return;
        const touch = event.touches[0];
        touchGesture = { x: touch.clientX, y: touch.clientY, target: event.target, direction: 0, distance: 0 };
      }, { passive: true });
      document.addEventListener("touchmove", (event) => {
        if (!touchGesture) return;
        if (event.touches.length !== 1) { touchGesture = null; return; }
        const dx = touchGesture.x - event.touches[0].clientX;
        const dy = event.touches[0].clientY - touchGesture.y;
        touchGesture.direction = 0;
        touchGesture.distance = 0;
        if (Math.abs(dx) <= Math.abs(dy) || Math.abs(dx) < 10) return;
        const direction = Math.sign(dx);
        if (canScrollInside(touchGesture.target, direction)) return;
        const index = tabOrder.indexOf(destinationPage || currentPage) + direction;
        if (index < 0 || index >= tabOrder.length) return;
        if (event.cancelable) event.preventDefault();
        touchGesture.direction = direction;
        touchGesture.distance = Math.abs(dx);
      }, { passive: false });
      document.addEventListener("touchend", () => {
        const gesture = touchGesture;
        touchGesture = null;
        if (!gesture || !gesture.direction || gesture.distance < 60) return;
        const now = performance.now();
        if (now < wheelBlockedUntil) return;
        const index = tabOrder.indexOf(destinationPage || currentPage) + gesture.direction;
        if (index < 0 || index >= tabOrder.length) return;
        wheelBlockedUntil = now + 800;
        loadPage(tabOrder[index]);
      }, { passive: true });

      // Leave pinch zoom and cancelled gestures to the browser.
      document.addEventListener("touchcancel", () => { touchGesture = null; }, { passive: true });
    </script>
